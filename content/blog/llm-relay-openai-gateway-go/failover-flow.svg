<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="llm-relay failover flow">
<defs><marker id="ah-n" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="ah-good" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker><marker id="ah-bad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="758" height="438" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<line x1="380" y1="86" x2="380" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#ah-n)"/>
<line x1="340" y1="216" x2="200" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#ah-n)"/><text x="150" y="256" text-anchor="middle" font-size="12" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif">1. try primary</text>
<line x1="320" y1="330" x2="438" y2="330" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-bad)"/><text x="379" y="322" text-anchor="middle" font-size="12" fill="#dc2626" font-family="ui-sans-serif,system-ui,sans-serif">2. 429 / 5xx / down</text>
<line x1="440" y1="216" x2="560" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#ah-n)"/><text x="560" y="256" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif">3. fail over</text>
<line x1="450" y1="158" x2="450" y2="88" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-good)"/><text x="460" y="124" text-anchor="start" font-size="12" fill="#16a34a" font-family="ui-sans-serif,system-ui,sans-serif">SSE stream</text>
<rect x="250" y="30" width="260" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="380" y="49" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif">Client (OpenAI SDK)</text><text x="380" y="67" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="400" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif">POST /v1/chat/completions</text>
<rect x="270" y="160" width="220" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="380" y="179" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#0c4a6e" font-family="ui-sans-serif,system-ui,sans-serif">llm-relay</text><text x="380" y="197" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="400" fill="#0c4a6e" font-family="ui-sans-serif,system-ui,sans-serif">quota + model + key</text>
<rect x="70" y="300" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="195" y="321" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif">Primary provider</text><text x="195" y="339" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="400" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif">e.g. Groq</text>
<rect x="440" y="300" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="565" y="321" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif">Fallback provider(s)</text><text x="565" y="339" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="400" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif">e.g. OpenAI</text>
<rect x="125" y="388" width="510" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="380" y="408" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#14532d" font-family="ui-sans-serif,system-ui,sans-serif">failover completes BEFORE the first byte reaches the client</text>
</svg>