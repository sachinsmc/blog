<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="TurboQuant two-stage pipeline">
<defs><marker id="ah-n" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="ah-good" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker><marker id="ah-bad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="638" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<line x1="320" y1="84" x2="320" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#ah-n)"/>
<line x1="320" y1="196" x2="320" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#ah-n)"/><text x="330" y="226" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif">looks Gaussian</text>
<line x1="320" y1="308" x2="320" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#ah-n)"/><text x="330" y="338" text-anchor="start" font-size="12" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif">small residual</text>
<line x1="320" y1="420" x2="320" y2="472" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-good)"/>
<rect x="170" y="30" width="300" height="54" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="320" y="48" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif">Input vectors</text><text x="320" y="66" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="400" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif">KV cache / embeddings</text>
