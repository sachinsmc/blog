<rect x="170" y="474" width="300" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="320" y="493" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#14532d" font-family="ui-sans-serif,system-ui,sans-serif">Compressed code</text><text x="320" y="511" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="400" fill="#14532d" font-family="ui-sans-serif,system-ui,sans-serif">3-4 bits/value, >=6x smaller, training-free</text>
