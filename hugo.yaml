baseURL: https://sachinsmc.me/
title: Sachin Chavan
theme: PaperMod
languageCode: en-us

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
pygmentsUseClasses: true

services:
  googleAnalytics:
    id: G-GKHL436Z98

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  defaultTheme: dark
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  displayFullLangName: true
  description: "Sachin Chavan, Software Engineer in Dubai. Full-stack and DevOps across Go, Node.js, Python, React, and AWS / GCP / Azure / Oracle. Writing about engineering, AI, cloud, and security."

  homeInfoParams:
    Title: "Hi, I'm Sachin \U0001F44B"
    Content: >
      Software Engineer at ReasonSoftware in Dubai. I work across the stack in Go,
      Node.js, Python, and React, with DevOps on AWS, GCP, Azure, and Oracle Cloud.
      I write about engineering, AI, cloud, security, and the things I learn along the way.

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/sachinsmc"
    - name: x
      title: X (Twitter)
      url: "https://x.com/smcsachin"
    - name: rss
      title: RSS
      url: "/index.xml"
    - name: email
      title: Email
      url: "mailto:hey@sachinsmc.me"

  label:
    text: "Sachin Chavan"

menu:
  main:
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
